<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#cfe9f7" />
    <title>ColorCell</title>
  </head>
  <body>
    <div id="app">
      <section id="menu" class="screen active">
        <h1 class="logo">ColorCell</h1>
        <p class="tagline">Relaxing gem art puzzles</p>
        <button id="btn-play" class="big green">PLAY</button>
        <button id="btn-levels" class="big blue">Levels</button>
        <button id="btn-gallery" class="big blue">Gallery</button>
      </section>

      <section id="levels" class="screen">
        <header class="bar">
          <button class="icon" data-goto="menu" aria-label="Back">‹</button>
          <h2>Levels</h2>
          <span class="spacer"></span>
        </header>
        <div id="levels-grid" class="grid"></div>
      </section>

      <section id="gallery" class="screen">
        <header class="bar">
          <button class="icon" data-goto="menu" aria-label="Back">‹</button>
          <h2>Gallery</h2>
          <span class="spacer"></span>
        </header>
        <div id="gallery-grid" class="grid"></div>
        <p id="gallery-empty" class="empty">Finished pictures will shine here.</p>
      </section>

      <section id="play" class="screen">
        <header class="bar">
          <button id="btn-back" class="icon" aria-label="Back">‹</button>
          <h2 id="level-name"></h2>
          <canvas id="preview" class="preview" title="Target picture"></canvas>
        </header>
        <canvas id="game"></canvas>
        <div class="toolbar">
          <button id="btn-hint" class="tool" title="Hint"><span>💡</span><small>Hint</small></button>
          <button id="btn-undo" class="tool" title="Undo"><span>↶</span><small>Undo</small></button>
          <button id="btn-smart" class="tool" title="Smart tap"><span>✨</span><small>Smart</small></button>
          <button id="btn-tray" class="tool" title="More tray space"><span>＋</span><small>Tray</small></button>
        </div>
        <div id="toast" class="toast"></div>
        <div id="win" class="overlay hidden">
          <div class="card">
            <h2>Beautiful!</h2>
            <canvas id="win-pic"></canvas>
            <button id="btn-next" class="big green">Next</button>
            <button id="btn-win-gallery" class="big blue">Gallery</button>
          </div>
        </div>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
